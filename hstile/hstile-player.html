<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, max-age=0, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>HSTile Low-Latency Player</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #status {
      position: absolute; right: 6px; bottom: 4px; z-index: 2;
      color: #9f9; font: 11px/1.2 monospace; background: rgba(0,0,0,.45);
      padding: 2px 4px; border-radius: 3px; pointer-events: none;
    }
  </style>
  <!-- Vendored hls.js (LAN-safe; no CDN required on tablets) -->
  <script src="hls.min.js"></script>
</head>
<body>
  <video id="video" playsinline muted autoplay></video>
  <div id="status">init</div>
  <script>
(function () {
  function param(key, fallback) {
    var q = new URLSearchParams(window.location.search);
    var v = q.get(key);
    return v == null || v === '' ? fallback : v;
  }
  function truthy(v, fallback) {
    if (v == null) return fallback;
    v = String(v).toLowerCase();
    return v === '1' || v === 'true' || v === 'yes' || v === 'on';
  }

  var id = param('id', '');
  var autoplay = truthy(param('autoplay', '1'), true);
  var mute = truthy(param('mute', '1'), true);
  // Optional absolute Restreamer origin for same-LAN tests. Default: this host.
  // Cross-origin bases only work if the remote sends CORS headers (stock Restreamer does not).
  var base = param('base', window.location.origin).replace(/\/$/, '');
  var statusEl = document.getElementById('status');
  var video = document.getElementById('video');

  function setStatus(msg) {
    statusEl.textContent = msg;
  }

  if (!id) {
    setStatus('missing ?id=<channel-uuid>');
    return;
  }

  video.muted = mute;
  video.playsInline = true;
  video.setAttribute('playsinline', '');
  video.setAttribute('webkit-playsinline', '');
  var src = base + '/memfs/' + encodeURIComponent(id) + '.m3u8';

  // Hold several whole segments behind the edge. Never change playbackRate
  // (rate catch-up reads as choppy). Only hard-seek when playing AND far
  // behind — never while paused (paused + seek loop = twitching).
  var TARGET_BEHIND_S = 5;
  var HARD_RESYNC_S = 20;

  function tryPlay() {
    if (!autoplay || !video.paused) return;
    video.play().catch(function () {});
  }

  function seekLiveEdge(force) {
    try {
      if (!video.seekable || video.seekable.length === 0) return;
      // Seeking while paused freezes currentTime while the edge advances,
      // which retriggers resync every few seconds and looks like twitching.
      if (video.paused && !force) {
        setStatus('paused');
        return;
      }
      var end = video.seekable.end(video.seekable.length - 1);
      if (!isFinite(end) || end <= 0) return;
      var lag = end - video.currentTime;
      if (force || lag > HARD_RESYNC_S) {
        video.currentTime = Math.max(0, end - TARGET_BEHIND_S);
        lag = TARGET_BEHIND_S;
      }
      setStatus(Math.max(0, lag).toFixed(1) + 's');
    } catch (e) { /* ignore */ }
  }

  function startNative() {
    video.src = src;
    video.addEventListener('loadedmetadata', function () { seekLiveEdge(true); tryPlay(); });
    video.addEventListener('canplay', tryPlay);
    video.addEventListener('playing', function () { seekLiveEdge(false); });
    tryPlay();
  }

  function armWatchdog() {
    setInterval(function () {
      if (video.paused) {
        tryPlay();
        return;
      }
      seekLiveEdge(false);
    }, 1000);
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) tryPlay();
  });

  if (!window.Hls || !Hls.isSupported()) {
    startNative();
    armWatchdog();
    return;
  }

  var hls = new Hls({
    enableWorker: true,
    lowLatencyMode: false,
    backBufferLength: 0,
    maxBufferLength: 14,
    maxMaxBufferLength: 18,
    // ~5s behind at 1s segments. Cap latency high so hls.js does not
    // hard-jump (visible twitch) during normal drift.
    liveSyncDurationCount: 5,
    liveMaxLatencyDurationCount: 30,
    maxLiveSyncPlaybackRate: 1,
    liveDurationInfinity: true,
    startPosition: -1,
    highBufferWatchdogPeriod: 2
  });

  hls.loadSource(src);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED, function () {
    tryPlay();
  });
  hls.on(Hls.Events.ERROR, function (_evt, data) {
    if (!data || !data.fatal) return;
    setStatus('fatal ' + data.type);
    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
    else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
  });
  armWatchdog();
})();
  </script>
</body>
</html>
