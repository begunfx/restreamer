<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, max-age=0, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>HSTile Low-Latency Player</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #status {
      position: absolute; left: 8px; bottom: 8px; z-index: 2;
      color: #9f9; font: 12px/1.3 monospace; background: rgba(0,0,0,.55);
      padding: 4px 6px; border-radius: 4px; pointer-events: none;
    }
  </style>
  <!-- Vendored hls.js (LAN-safe; no CDN required on tablets) -->
  <script src="hls.min.js"></script>
</head>
<body>
  <video id="video" playsinline muted></video>
  <div id="status">init</div>
  <script>
(function () {
  function param(key, fallback) {
    var q = new URLSearchParams(window.location.search);
    var v = q.get(key);
    return v == null || v === '' ? fallback : v;
  }
  function truthy(v, fallback) {
    if (v == null) return fallback;
    v = String(v).toLowerCase();
    return v === '1' || v === 'true' || v === 'yes' || v === 'on';
  }

  var id = param('id', '');
  var autoplay = truthy(param('autoplay', '1'), true);
  var mute = truthy(param('mute', '1'), true);
  // Optional absolute Restreamer origin for same-LAN tests. Default: this host.
  // Cross-origin bases only work if the remote sends CORS headers (stock Restreamer does not).
  var base = param('base', window.location.origin).replace(/\/$/, '');
  var statusEl = document.getElementById('status');
  var video = document.getElementById('video');

  function setStatus(msg) {
    statusEl.textContent = msg;
  }

  if (!id) {
    setStatus('missing ?id=<channel-uuid>');
    return;
  }

  video.muted = mute;
  var src = base + '/memfs/' + encodeURIComponent(id) + '.m3u8';

  function seekLiveEdge() {
    try {
      if (!video.seekable || video.seekable.length === 0) return;
      var end = video.seekable.end(video.seekable.length - 1);
      if (isFinite(end) && end > 0) {
        // Stay ~1s behind live edge to reduce rebuffer stalls
        video.currentTime = Math.max(0, end - 1.0);
      }
    } catch (e) { /* ignore */ }
  }

  function startNative() {
    video.src = src;
    video.addEventListener('loadedmetadata', seekLiveEdge);
    video.addEventListener('playing', seekLiveEdge);
    if (autoplay) video.play().catch(function () {});
    setStatus('native HLS ' + id);
  }

  if (video.canPlayType('application/vnd.apple.mpegurl') && !window.Hls) {
    startNative();
    return;
  }

  if (!window.Hls || !Hls.isSupported()) {
    startNative();
    return;
  }

  var hls = new Hls({
    enableWorker: true,
    lowLatencyMode: true,
    backBufferLength: 0,
    maxBufferLength: 4,
    maxMaxBufferLength: 6,
    liveSyncDurationCount: 1,
    liveMaxLatencyDurationCount: 3,
    liveDurationInfinity: true,
    highBufferWatchdogPeriod: 1
  });

  hls.loadSource(src);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED, function () {
    seekLiveEdge();
    if (autoplay) video.play().catch(function () {});
    setStatus('hls.js LL ' + id);
  });
  hls.on(Hls.Events.ERROR, function (_evt, data) {
    if (!data) return;
    if (data.fatal) {
      setStatus('fatal ' + data.type + '/' + data.details);
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
      else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
    }
  });

  // Periodic re-sync if the tablet drifts behind live
  setInterval(function () {
    if (video.paused) return;
    try {
      if (!video.seekable || video.seekable.length === 0) return;
      var end = video.seekable.end(video.seekable.length - 1);
      var lag = end - video.currentTime;
      if (lag > 8) {
        video.currentTime = Math.max(0, end - 1.0);
        setStatus('resync lag=' + lag.toFixed(1) + 's');
      }
    } catch (e) { /* ignore */ }
  }, 5000);
})();
  </script>
</body>
</html>
